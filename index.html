<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo X factr</title>
    <style>
      .loader {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 0);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        animation: fadeOut 1500ms ease-in-out forwards;
      }

      .hide-loader {
        display: none;
      }

      @keyframes fadeOut {
        0% {
          opacity: 1;
        }

        50% {
          opacity: 1;
        }

        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body data-template="default">
    <div id="loader" class="loader">
      <img src="/logo.png" alt="App logo" width="150" height="150" />
    </div>

    <div id="app" class="app">
      <div class="app__container">
        <div class="app__button--container py-2">
          <button
            id="dragOutMainViewButton"
            class="button button__round"
            title="Drag out view"
            aria-label="Drag out view"
          >
            <span class="material-symbols-outlined"> chevron_left </span>
          </button>
        </div>

        <header class="app__header p-3">
          <div class="app__header--top">
            <section class="app__header--profile">
              <div class="app__header--profile__image">
                <img
                  src="/src/images/Gorilla-soldier_100x100.jpeg"
                  alt="User image"
                />
              </div>

              <h2 class="app__header--profile__name">
                <span class="app__header--profile__name--first"> Gorilla </span>
                <span class="app__header--profile__name--last"> Soldier</span>
              </h2>
            </section>

            <nav class="app__header--nav">
              <ul class="app__header--nav__list">
                <li class="app__header--nav__item">
                  <button
                    id="tasksNavButton"
                    aria-label="Navigate to tasks"
                    class="button app__header--nav__button"
                    data-view="tasks"
                  >
                    <span class="material-symbols-outlined"> priority </span>

                    <span class="app__header--nav__item--text"> Tasks </span>
                  </button>
                </li>

                <li class="app__header--nav__item">
                  <button
                    id="categoriesNavButton"
                    aria-label="Navigate to categories"
                    class="button app__header--nav__button"
                    data-view="categories"
                  >
                    <span class="material-symbols-outlined"> view_cozy </span>

                    <span class="app__header--nav__item--text">
                      Categories
                    </span>
                  </button>
                </li>

                <li class="app__header--nav__item">
                  <button
                    id="templatesNavButton"
                    aria-label="Navigate to templates"
                    class="button app__header--nav__button"
                    data-view="templates"
                  >
                    <span class="material-symbols-outlined"> Bookmark </span>

                    <span class="app__header--nav__item--text">
                      Templates
                    </span>
                  </button>
                </li>

                <li class="app__header--nav__item">
                  <button
                    id="analyticsNavButton"
                    aria-label="Navigate to analytics"
                    class="button app__header--nav__button"
                    data-view="analytics"
                  >
                    <span class="material-symbols-outlined"> donut_large </span>

                    <span class="app__header--nav__item--text">
                      Analytics
                    </span>
                  </button>
                </li>
              </ul>
            </nav>
          </div>

          <section class="app__header--analytics">
            <div class="app__header--analytics__graph">
              <img
                src="/src/images/line-graph.png"
                alt="Graph showing progress"
                class="app__header--analytics__graph--image"
              />
            </div>

            <div class="app__header--analytics__report">
              <h2 class="app__header--analytics__report--title">Consistency</h2>

              <p class="app__header--analytics__report--text">Good</p>
            </div>
          </section>
        </header>

        <main class="main" id="main">
          <header class="main__header p-2">
            <div class="main__header--button">
              <button
                id="dragAppButton"
                class="button button__round app__header--button__toggle"
                title="Drag in or out"
                aria-label="Drag out view"
              >
                <span class="material-symbols-outlined"> drag_handle </span>
              </button>
            </div>

            <nav class="main__nav">
              <span class="button button__round">
                <span class="material-symbols-outlined"> search </span>
              </span>

              <span class="button button__round">
                <span class="material-symbols-outlined"> notifications </span>
              </span>
            </nav>
          </header>

          <div id="mainView" class="main__view main__view--home">
            <header class="main__view--header px-2 pt-2">
              <h2 class="main__view--title">What's up, Gorilla?</h2>
            </header>

            <div class="main__view--section px-2">
              <h3 class="main__view--subtitle">Categories</h3>

              <ul class="category__list">
                Categories are dynamically rendered here
              </ul>
            </div>

            <div class="main__view--section px-2">
              <header class="task__list--today__header">
                <h3 class="main__view--subtitle">Today's tasks</h3>

                <div class="task__list--today__header--more">
                  <!-- Task list menu is dynamically rendered here -->
                </div>
              </header>

              <ul id="todayTaskList" class="task__list px-2">
                Task items are dynamically rendered here
              </ul>
            </div>

            <div class="main__view--button__container">
              <button
                id="openTaskDialogButton"
                class="button button__primary button__primary--round main__entryForm--button main__view--button"
                title="Add new item"
                aria-label="Add new item to list"
                data-view="home"
              >
                <span class="material-symbols-outlined"> add </span>
              </button>
            </div>
          </div>
          <!-- 
        <section
          id="analyticsView"
          class="app__view app__view--analytics hidden"
        >
          <header class="app__view--header padding">
            <h2 class="app__view--title">Analytics</h2>
          </header>
        </section> -->

          <div
            id="dialogContainer"
            class="dialog__container dialog__home closed"
            data-dialog=""
          >
            <div class="dialog__dragButton--container">
              <button
                id="toggleDialogButton"
                class="dialog__dragButton button button__round"
                aria-label="Close dialog"
              >
                <span class="material-symbols-outlined">drag_handle</span>
              </button>
            </div>

            <dialog
              id="dialog"
              class="dialog"
              role="dialog"
              aria-modal="true"
              inert
            >
              <div class="dialog__content padding">
                Dialog content goes here
              </div>
            </dialog>
          </div>
        </main>
      </div>
    </div>
  </body>
  <script type="module" src="/src/main.ts"></script>
</html>
